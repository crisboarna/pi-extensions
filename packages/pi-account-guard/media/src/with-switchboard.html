<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/modules/@xterm/xterm/css/xterm.css">
<link rel="stylesheet" href="/stage/stage.css">
<script src="/modules/@xterm/xterm/lib/xterm.js"></script>
<script src="/stage/stage.js"></script>
<script src="/stage/clip.js"></script>
</head>
<body>
<script>
// pi-switchboard: the guard checks the account of every model behind switchboard/auto.
clip(async (stage) => {
	stage.caption("With pi-switchboard, the guard checks <b>every model</b> behind switchboard/auto.", "with-switchboard");
	await stage.type("what does install.sh do?");
	await stage.press("Enter");
	await stage.waitFor(/BLOCKED +openai \(env:OPENAI_API_KEY\) is zone work/);
	await sleep(400);
	stage.callout(/BLOCKED +openai/, "the deep tier runs on the <b>work</b> account", { place: "below", last: true });
	await sleep(3000);
	stage.clear();
	stage.caption("Blocked before the classifier or any model sees the prompt.", "with-switchboard");
	await stage.still();
	await sleep(3000);
}, { title: "~/code/dotfiles — pi" });
</script>
</body>
</html>
