name: Wrong block, route or expansion
description: A package did the wrong thing, or the right thing for the wrong reason. A turn was blocked that should go, a request went to the wrong tier, or a #word expanded or did not.
labels: [bug]
body:
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - pi-context-refs
        - pi-account-guard
        - pi-switchboard
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what happened instead
      description: |
        pi-account-guard: the turn that was blocked (or let through), the account and the directory, and what you wanted.
        pi-switchboard: the request, the tier you expected and the tier it used (`/tier explain` shows why).
        pi-context-refs: the text you typed, what you expected it to send, and what it sent (`/ref sent`).
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: |
        Run the check for your package and paste its output. Remove account names and secrets.
        pi-account-guard: `/guard check here`
        pi-switchboard: `/tier doctor`
        pi-context-refs: `/ref doctor`
      render: text
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: The configuration involved
      description: The smallest part of your config that decides this, with secrets, account names and private paths removed. For pi-account-guard that is the account and the place rule; for pi-switchboard the rule and the tiers; for pi-context-refs the ref.
      render: json
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Output of `pi --version`, the package version (`pi list`), Node version and OS.
    validations:
      required: true
