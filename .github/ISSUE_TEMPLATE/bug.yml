name: Bug report
description: Something in one of the packages does not work as documented.
labels: [bug]
body:
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - pi-switchboard
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Output of `pi --version`, the package version (`pi list`), Node version and OS.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest config and commands that show the problem. Remove secrets and account names.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or decision records
      render: text
