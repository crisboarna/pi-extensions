<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="pi-switchboard">
  <title>pi-switchboard</title>
  <rect width="64" height="64" rx="12" fill="#233040"/>
  <!-- idle cords to the deep and light jacks -->
  <path d="M15 32 C 28 32, 31 16, 44 16" fill="none" stroke="#56677a" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M15 32 C 28 32, 31 48, 44 48" fill="none" stroke="#56677a" stroke-width="2.5" stroke-linecap="round"/>
  <!-- the patch cord, hanging with a little sag: request to the chosen tier -->
  <path d="M15 32 Q 31 43, 47 32" fill="none" stroke="#c8452f" stroke-width="4" stroke-linecap="round"/>
  <!-- input jack -->
  <circle cx="15" cy="32" r="5.5" fill="#c9a34e"/>
  <circle cx="15" cy="32" r="2.2" fill="#233040"/>
  <!-- tier jacks: deep, the patched one, light -->
  <circle cx="49" cy="16" r="5" fill="#233040" stroke="#c9a34e" stroke-width="2.5"/>
  <circle cx="49" cy="32" r="5.5" fill="#c9a34e"/>
  <circle cx="49" cy="32" r="2.2" fill="#c8452f"/>
  <circle cx="49" cy="48" r="5" fill="#233040" stroke="#c9a34e" stroke-width="2.5"/>
</svg>
