<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/modules/@xterm/xterm/css/xterm.css">
<link rel="stylesheet" href="/stage/stage.css">
<script src="/modules/@xterm/xterm/lib/xterm.js"></script>
<script src="/stage/stage.js"></script>
<script src="/stage/clip.js"></script>
</head>
<body>
<script>
// Checklist item 5, after: the guard key placed in powerline.customItems.
clip(async (stage) => {
	await stage.waitFor("guard personal ✓");
	// Promoted to its own item, the key leaves the aggregate extension statuses: it shows once.
	const shown = stage.lines().join("\n").split("guard personal").length - 1;
	if (shown !== 1) throw new Error(`the guard text shows ${shown} times`);
	await stage.still("5-match");
	await stage.command("/model acme/work-model");
	await stage.waitFor("acme is work");
	await stage.still("5-no-match");
	await stage.command("/model spare/spare-model");
	await stage.waitFor("? untagged");
	await stage.still("5-untagged");
}, { title: "~/personal/garden-planner — pi" });
</script>
</body>
</html>
