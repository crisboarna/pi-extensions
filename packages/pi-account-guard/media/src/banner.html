<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="brand.css">
<style>
	body { display: grid; grid-template-columns: 420px 1fr; align-items: center; padding: 0 64px 0 40px; }
	.panel { width: 420px; height: 300px; }
	.word { font-family: var(--sans); font-weight: 600; font-size: 64px; letter-spacing: -0.01em; line-height: 1; white-space: nowrap; }
	.line { margin-top: 18px; font-size: 25px; line-height: 1.35; max-width: 34ch; }
	body.dark .line { color: #d9cfbb; }
	body.light .line { color: #3a4552; }
</style>
</head>
<body>
<img class="panel" src="panel.svg" alt="">
<div>
	<div class="word">pi-account-guard</div>
	<p class="line">Rotate freely. Never into the wrong zone.</p>
</div>
<script>document.body.className = new URLSearchParams(location.search).get("theme") ?? "dark";</script>
</body>
</html>
