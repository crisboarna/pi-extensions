<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/modules/@xterm/xterm/css/xterm.css">
<link rel="stylesheet" href="/stage/stage.css">
<script src="/modules/@xterm/xterm/lib/xterm.js"></script>
<script src="/stage/stage.js"></script>
<script src="/stage/clip.js"></script>
</head>
<body>
<script>
// Checklist items 1 and 2: the Block select, Cancel, Allow once, Allow for session.
clip(async (stage) => {
	await stage.type("what does install.sh do?");
	await stage.press("Enter");
	await stage.waitFor("BLOCKED  openai (env:OPENAI_API_KEY) is zone work");
	await stage.waitFor("Place ~/code/dotfiles -> zone personal");
	const rows = ["Switch to anthropic", "Allow once: this turn to openai", "Allow for session: openai", "Cancel"].map((row) => stage.find(row)?.row);
	if (rows.some((row) => row === undefined) || rows.some((row, i) => i > 0 && row <= rows[i - 1])) throw new Error(`rows out of order: ${rows}`);
	await stage.still("1-block");
	for (let i = 0; i < 3; i++) await stage.press("ArrowDown", { after: 150 });
	await stage.press("Enter", { after: 800 });
	await stage.waitFor(/what does install\.sh do\?\s*$/, { last: true });
	await stage.still("1-cancel");
	await stage.press("Enter");
	await stage.waitFor("BLOCKED  openai");
	await stage.press("ArrowDown", { after: 150 });
	await stage.press("Enter", { after: 800 });
	await stage.waitFor(/openai|personal/);
	await stage.still("2-allow-once-confirm");
	await stage.press("Enter", { after: 400 });
	await stage.waitFor("Done on openai/gpt-5.5.");
	await stage.type("and what does the Brewfile install?");
	await stage.press("Enter");
	await stage.waitFor("BLOCKED  openai", { last: true });
	await stage.press("ArrowDown", { after: 150 });
	await stage.press("ArrowDown", { after: 150 });
	await stage.press("Enter", { after: 600 });
	await stage.waitFor("guard OVERRIDE openai in personal", { timeout: 15000 });
	await stage.waitFor("Done on openai/gpt-5.5.", { last: true });
	await stage.still("2-allow-session");
}, { title: "~/code/dotfiles — pi" });
</script>
</body>
</html>
