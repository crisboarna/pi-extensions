# Runs the suites that load a real pi against one chosen version of pi, so the range the packages declare (PI_PEER_RANGE in
# scripts/lib/repo.ts) is tested, not assumed. Called by verify.yml for the floor and the newest release inside the range, and by the
# nightly run for the newest release there is. `scripts/pi-host.ts` swaps the four pi packages in node_modules; every path that loads
# pi reads it from there, so no test changes between lanes.
name: Pi compatibility

on:
  workflow_call:
    inputs:
      pi:
        description: floor, latest, newest or an exact version (scripts/pi-host.ts)
        required: true
        type: string
      allow-young:
        description: let the version be younger than min-release-age; only the run that must catch a release on its first day sets it
        required: false
        default: false
        type: boolean
      advisory:
        description: a failure is a warning, not a red run
        required: false
        default: false
        type: boolean
    outputs:
      pi:
        description: the version of pi that was tested
        value: ${{ jobs.run.outputs.pi }}

permissions: {}

jobs:
  run:
    name: pi ${{ inputs.pi }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: ${{ inputs.advisory }}
    permissions:
      contents: read # check out the repository
    outputs:
      pi: ${{ steps.host.outputs.pi }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      # Replaces the pinned pi in node_modules (not package.json or the lockfile) and records the version actually tested in the job summary.
      - name: Install the chosen pi
        id: host
        env:
          PI_SPEC: ${{ inputs.pi }}
          ALLOW_YOUNG: ${{ inputs.allow-young }}
        run: |
          args=("$PI_SPEC")
          if [ "$ALLOW_YOUNG" = "true" ]; then args+=(--allow-young); fi
          node scripts/pi-host.ts "${args[@]}"

      - name: Types against this pi
        run: npm run typecheck

      - name: Integration tests through jiti and real-TUI tests, as pi loads extensions
        run: npm run test:integration

      - name: Install every package from its tarball and load it
        run: npm run smoke:pack

      - name: End to end in real pi, from the tarballs, pi-switchboard alone and with account-guard
        run: npm run test:e2e

      - name: account-guard smoke tests in real pi
        run: PI_BIN="$GITHUB_WORKSPACE/node_modules/.bin/pi" npm run test:smoke --workspace packages/pi-account-guard

      - name: context-refs smoke tests in real pi
        run: PI_BIN="$GITHUB_WORKSPACE/node_modules/.bin/pi" npm run test:smoke --workspace packages/pi-context-refs

      # An advisory run that failed still shows up: a red step inside a green job is easy to miss on a pull request.
      - name: Say that an advisory run failed
        if: ${{ failure() && inputs.advisory }}
        env:
          PI_VERSION: ${{ steps.host.outputs.pi }}
        run: echo "::warning title=pi ${PI_VERSION} breaks the packages::This run is advisory, so the check stays green. Read the failed step above."
