<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="brand.css">
<style>
	body { padding: 56px 72px 0; display: flex; flex-direction: column; }
	main { display: grid; grid-template-columns: 1fr 400px; align-items: center; gap: 24px; }
	.mark { width: 88px; height: 88px; }
	.word { margin-top: 24px; font-family: var(--sans); font-weight: 600; font-size: 80px; line-height: 1; letter-spacing: -0.01em; }
	.line { margin-top: 24px; font-size: 30px; line-height: 1.3; max-width: 24ch; color: #3a4552; }
	.panel { width: 400px; height: 286px; }
	.receipt { margin-top: auto; margin-left: -72px; margin-right: -72px; height: 112px; background: var(--panel); display: flex; align-items: center; gap: 22px; padding: 0 72px; }
	.jack { width: 26px; height: 26px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #e3c47a, #a8823a); position: relative; flex: none; }
	.jack::after { content: ""; position: absolute; inset: 8px; border-radius: 50%; background: var(--cord); }
	.decision { font-family: var(--mono); font-size: 25px; color: var(--cream); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body class="light">
	<main>
		<div>
			<img class="mark" src="mark.svg" alt="">
			<div class="word">pi-switchboard</div>
			<p class="line">The right model for every request, subagents included, with a receipt for each choice.</p>
		</div>
		<img class="panel" src="panel.svg" alt="">
	</main>
	<div class="receipt"><span class="jack"></span><span class="decision" id="decision"></span></div>
	<script src="data.js"></script>
	<script>document.getElementById("decision").textContent = window.MEDIA.cover;</script>
</body>
</html>
