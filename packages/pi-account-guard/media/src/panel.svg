<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" width="420" height="300" aria-hidden="true">
  <defs>
    <radialGradient id="brass" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#e3c47a"/><stop offset="1" stop-color="#a8823a"/></radialGradient>
    <radialGradient id="glow" r="50%"><stop offset="0" stop-color="#7fbf6a" stop-opacity="0.55"/><stop offset="1" stop-color="#7fbf6a" stop-opacity="0"/></radialGradient>
  </defs>
  <rect x="20" y="24" width="380" height="252" rx="18" fill="#233040"/>
  <g font-family="IBM Plex Sans Condensed" font-size="17" fill="#f1e6cf" opacity="0.8">
    <text x="82" y="200" text-anchor="middle">account</text>
    <text x="312" y="96">work</text>
    <text x="312" y="216">personal</text>
  </g>
  <!-- the work jack: its keyway is cut at the top, so the personal plug does not fit -->
