# Verification shared by pull requests and main: every repository gate
# (including knip, gitleaks, actionlint and zizmor in pinned Docker images),
# the tests with 90% coverage thresholds, the same tests on the oldest
# supported Node, the tarball smoke test, the end-to-end tests in real pi, the
# same suites against the floor and the newest release of the pi range the
# packages declare, and the dependency audits. Called by pr.yml and main.yml.
name: Verify

on:
  workflow_call:

permissions: {}

jobs:
  gates:
    name: gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # check out the repository
    env:
      DOCKER_IMAGE_CACHE: .cache/docker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the whole history
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      # Tool images are pinned by digest in scripts/tools and tools/docker, so the key changes only when a pin does.
      - name: Cache tool images
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/docker
          key: docker-${{ hashFiles('tools/docker/**', 'scripts/tools/*.ts') }}

      - name: Cache knip analysis
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/knip
          key: knip-${{ github.sha }}
          restore-keys: knip-

      - run: npm ci

      - name: Repository gates
        env:
          GH_TOKEN: ${{ github.token }} # lets zizmor check pinned action SHAs online
        run: npm run check

  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # check out the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Unit and integration tests with coverage thresholds
        run: npm run coverage

      # The README badges show these numbers. They are written only here, after the thresholds held, and served by the Pages build of a verified main.
      - name: Write the badge documents
        run: node scripts/badges.ts badges

      - name: Keep the badge documents for the site build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: badges
          path: badges
          if-no-files-found: error
          retention-days: 7

      - name: Integration tests through jiti, as pi loads extensions
        run: npm run test:integration

      - name: Repository script tests
        run: npm run test:repo

      - name: Install every package from its tarball and load it
        run: npm run smoke:pack

      # The suites that need no model server; the model-server suites run on demand (E2E_SERVERS).
      - name: End to end in real pi, from the tarballs, pi-switchboard alone and with account-guard
        run: npm run test:e2e

      - name: account-guard smoke tests in real pi
        run: PI_BIN="$GITHUB_WORKSPACE/node_modules/.bin/pi" npm run test:smoke --workspace packages/pi-account-guard

      - name: context-refs smoke tests in real pi
        run: PI_BIN="$GITHUB_WORKSPACE/node_modules/.bin/pi" npm run test:smoke --workspace packages/pi-context-refs

  # Packages claim root engines.node; scripts/checks/manifests.ts fails if this version and that floor differ.
  floor:
    name: tests on the oldest supported Node
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # check out the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Install with the repository's Node and npm: Node 22 ships npm 10, which ignores min-release-age and strict-allow-scripts.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      # Then run everything on the oldest Node the packages support.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.19.0

      - name: Unit and repository script tests
        run: npm test

      - name: Integration tests through jiti, as pi loads extensions
        run: npm run test:integration

      - name: Install every package from its tarball and load it
        run: npm run smoke:pack

      # The suites that need no model server; the model-server suites run on demand (E2E_SERVERS).
      - name: End to end in real pi, from the tarballs, pi-switchboard alone and with account-guard
        run: npm run test:e2e

      - name: account-guard smoke tests in real pi
        run: PI_BIN="$GITHUB_WORKSPACE/node_modules/.bin/pi" npm run test:smoke --workspace packages/pi-account-guard

      - name: context-refs smoke tests in real pi
        run: PI_BIN="$GITHUB_WORKSPACE/node_modules/.bin/pi" npm run test:smoke --workspace packages/pi-context-refs

  # The packages declare PI_PEER_RANGE (scripts/lib/repo.ts); these two lanes run the real-pi suites at its bottom and at the newest release
  # inside it that is old enough, so the declaration is tested at both ends. pi-compat.yml says what a lane runs.
  pi-floor:
    name: pi floor
    uses: ./.github/workflows/pi-compat.yml # zizmor: ignore[self-repository] actionlint 1.7 does not accept the $/ form yet
    with:
      pi: floor
    permissions:
      contents: read # check out the repository

  pi-latest:
    name: pi latest
    uses: ./.github/workflows/pi-compat.yml # zizmor: ignore[self-repository] actionlint 1.7 does not accept the $/ form yet
    with:
      pi: latest
    permissions:
      contents: read # check out the repository

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # check out the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Registry signatures and provenance of installed packages
        run: npm audit signatures

      # Only runtime dependencies reach users; dev tooling is updated through Dependabot. npm audit has no
      # allow-list, so scripts/tools/audit.ts applies the dated, per-advisory entries of audit-exceptions.json.
      - name: Known vulnerabilities in runtime dependencies
        run: node scripts/tools/audit.ts
