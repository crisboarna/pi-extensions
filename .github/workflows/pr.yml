# Pull requests into main: full verification, plus the rules that only make
# sense for a pull request (commit messages, signatures, changesets, new
# dependencies).
name: Pull request

on:
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    uses: ./.github/workflows/verify.yml # zizmor: ignore[self-repository] actionlint 1.7 does not accept the $/ form yet
    permissions:
      contents: read # passed to the reusable workflow's jobs

  # The newest pi there is, even one younger than min-release-age (the nightly run has the same lane, blocking). Advisory here: a break
  # caused by a pi release is not this pull request's fault, so it shows as a warning and the check stays green.
  pi-newest:
    name: pi newest (advisory)
    uses: ./.github/workflows/pi-compat.yml # zizmor: ignore[self-repository] actionlint 1.7 does not accept the $/ form yet
    with:
      pi: newest
      allow-young: true
      advisory: true
    permissions:
      contents: read # passed to the reusable workflow's jobs

  # The release pull request (changesets bumps the versions on this branch) is the last place to catch a release that would be half done or
  # a version that is not newer than npm's: npm cannot unpublish and a tag cannot be reused. Same check as release-dry-run.yml.
  release-plan:
    name: release plan
    if: ${{ github.head_ref == 'changeset-release/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # check out the repository and its tags
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the plan reads the git tags
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: What the release would publish, and a dry run of each package
        run: node scripts/release/plan.ts

  rules:
    name: pull request rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # check out the repository and read commits
      pull-requests: read # list the pull request's commits and their verification
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # commit-message and changeset checks read the whole range
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Every commit is signed and verified by GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/checks/github-signatures.ts --pull "$PR_NUMBER"

      - name: Commit messages follow the convention
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/checks/commit-msg.ts --range "$BASE..$HEAD"

      # The version pull request consumes every changeset while it bumps the packages, so `changeset status` cannot pass on it; the
      # release plan job checks it instead. Skipped only for that branch when GitHub Actions opened it from this repository.
      - name: Every changed package has a changeset
        if: ${{ !(github.head_ref == 'changeset-release/main' && github.event.pull_request.user.login == 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository) }}
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: npx changeset status --since="$BASE"

      # Dependency review needs GitHub Advanced Security on a private repository; it runs once the repository is public.
      - name: New dependencies have no known vulnerabilities and an allowed licence
        if: ${{ !github.event.repository.private }}
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          allow-licenses: MIT, ISC, Apache-2.0, BSD-2-Clause, BSD-3-Clause, 0BSD, BlueOak-1.0.0, CC0-1.0, Python-2.0, Unlicense
