<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/repo/tools/brand/tokens.css">
<style>
	* { box-sizing: border-box; margin: 0; }
	html, body { width: 100%; height: 100%; }
	body { font-family: var(--text); -webkit-font-smoothing: antialiased; overflow: hidden; display: grid; grid-template-columns: 200px 1fr; align-items: center; gap: 44px; padding: 0 64px; }
	body.dark { background: var(--panel-deep); color: var(--cream); }
	body.light { background: var(--paper); color: var(--ink); }
	.mark { width: 200px; height: 200px; }
	.word { font-family: var(--sans); font-weight: 600; font-size: 72px; letter-spacing: -0.01em; line-height: 1; }
	.line { margin-top: 14px; font-size: 27px; }
	body.dark .line { color: #d9cfbb; }
	body.light .line { color: #3a4552; }
	.packages { margin-top: 26px; display: flex; gap: 34px; font-family: var(--mono); font-size: 21px; }
	.packages span { display: flex; align-items: center; gap: 12px; }
	.packages img { width: 40px; height: 40px; }
</style>
</head>
<body>
<img class="mark" src="/repo/site/assets/mark.svg" alt="">
<div>
	<div class="word">pi-extensions</div>
	<p class="line">Route every request. Guard every account.</p>
	<div class="packages">
		<span><img src="/repo/packages/pi-switchboard/media/src/mark.svg" alt="">pi-switchboard</span>
		<span><img src="/repo/packages/pi-account-guard/media/src/mark.svg" alt="">pi-account-guard</span>
	</div>
</div>
<script>document.body.className = new URLSearchParams(location.search).get("theme") ?? "dark";</script>
</body>
</html>
