# The latency gate, advisory: times what a user waits for (real pi loading each extension, and pi-switchboard's rule evaluation) on the pull request's base and
# head, one after the other on this one runner, and fails the job only when the rank test, the relative slowdown and the absolute slowdown all say the head is
# slower, twice in a row (scripts/bench.ts, scripts/lib/stats.ts). Advisory on purpose: the job is allowed to fail without blocking a merge, for thirty days, so the
# thresholds can be checked against real runner noise before anyone decides to require it. It is not a required check for the same reason macos.yml is not: a
# path-filtered workflow that does not run leaves a required check pending forever.
name: Bench

on:
  pull_request:
    branches: [main]
    paths:
      - "packages/*/src/**"
      - "packages/*/package.json"
      - "scripts/bench.ts"
      - "scripts/lib/stats.ts"
      - "package-lock.json"
      - ".github/workflows/bench.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: bench-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  latency:
    name: latency (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Not a gate yet: a slowdown shows as a failed job and a warning, and merging stays possible.
    continue-on-error: true
    permissions:
      contents: read # check out the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The base of the change, beside the head, so both are measured by the same runner in the same minutes. A manual run has no base and only measures the head.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ github.event_name == 'pull_request' }}
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Install the base's own dependencies
        if: ${{ github.event_name == 'pull_request' }}
        working-directory: base
        run: npm ci

      - name: Measure the base and the head
        env:
          HAS_BASE: ${{ github.event_name == 'pull_request' }}
        run: |
          # Without pipefail the exit code of tee, which is always 0, would hide a failed measurement.
          set -o pipefail
          args=(--samples 30 --json bench.json --fail)
          if [ "$HAS_BASE" = "true" ]; then args+=(--base base); fi
          node scripts/bench.ts "${args[@]}" | tee bench.txt
          {
            echo '### Latency'
            echo
            echo 'Median of 30 alternating samples per tree on one runner; a regression needs p < 0.01, a quarter slower and a material amount slower, twice in a row.'
            echo
            echo '```text'
            cat bench.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: bench
          path: bench.json
          if-no-files-found: ignore
          retention-days: 14
