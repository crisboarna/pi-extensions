  <circle cx="270" cy="90" r="20" fill="url(#brass)"/><circle cx="270" cy="90" r="9" fill="#1a2431"/>
  <rect x="266" y="72" width="8" height="12" fill="#1a2431"/>
  <circle cx="270" cy="46" r="8" fill="#4a2a28"/>
  <!-- the personal jack, keyway at the bottom, with the keyed plug seated and the lamp lit -->
  <circle cx="270" cy="210" r="20" fill="url(#brass)"/><circle cx="270" cy="210" r="9" fill="#1a2431"/>
  <rect x="266" y="216" width="8" height="12" fill="#1a2431"/>
  <circle cx="270" cy="166" r="22" fill="url(#glow)"/>
  <circle cx="270" cy="166" r="8" fill="#7fbf6a"/>
  <path d="M82 150 C 160 150, 150 210, 212 210" fill="none" stroke="#3f8f8c" stroke-width="8" stroke-linecap="round"/>
  <rect x="206" y="198" width="46" height="24" rx="6" fill="#3f8f8c"/>
  <rect x="266" y="222" width="8" height="12" fill="#3f8f8c"/>
  <rect x="248" y="203" width="22" height="14" rx="3" fill="#d9e6e0"/>
  <circle cx="82" cy="150" r="22" fill="url(#brass)"/><circle cx="82" cy="150" r="9" fill="#1a2431"/>
