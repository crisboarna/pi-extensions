<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/modules/@xterm/xterm/css/xterm.css">
<link rel="stylesheet" href="/stage/stage.css">
<script src="/modules/@xterm/xterm/lib/xterm.js"></script>
<script src="/stage/stage.js"></script>
<script src="/stage/clip.js"></script>
</head>
<body>
<script>
// Checklist item 3: the tag prompt for an untagged account.
clip(async (stage) => {
	await stage.type("summarize the garden beds");
	await stage.press("Enter");
	await stage.waitFor(/spare/);
	await sleep(600);
	await stage.still("3-tag-prompt");
	await stage.press("Escape", { after: 800 });
	await stage.waitFor("BLOCKED");
	await stage.still("3-esc-to-block");
	for (let i = 0; i < 6 && !stage.find(/→ Cancel/); i++) await stage.press("ArrowDown", { after: 150 });
	await stage.press("Enter", { after: 800 });
	await stage.press("Enter");
	await stage.waitFor(/spare/);
	await sleep(500);
	for (let i = 0; i < 4 && !stage.find(/→ .*personal/); i++) await stage.press("ArrowDown", { after: 150 });
	await stage.press(" ", { after: 300 });
	await stage.still("3-checked");
	await stage.press("Enter", { after: 800 });
	await stage.waitFor("Done on spare/spare-model.", { timeout: 15000 });
	await stage.command("/guard");
	await stage.waitFor(/Untagged\s+none/);
	await stage.still("3-tagged");
}, { title: "~/personal/garden-planner — pi" });
</script>
</body>
</html>
