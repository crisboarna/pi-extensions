# The family site on GitHub Pages: built from the packages' Markdown, media,
# explainers and live try-it snapshots, then deployed. Called by main.yml
# only after verification and the signature check pass, so the site always
# matches a verified main.
name: Pages

on:
  workflow_call:

permissions: {}

jobs:
  build:
    name: build the site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # check out the repository
    env:
      DOCKER_IMAGE_CACHE: .cache/docker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      # The snapshot builder's Node image is pinned by digest in tools/site/snapshot.ts.
      - name: Cache the snapshot image
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/docker
          key: site-docker-${{ hashFiles('tools/site/snapshot.ts') }}

      - run: npm ci

      # Installs pi and each packed package from npm in Docker, for the live try-it pages.
      - run: npm run site:snapshots

      - run: npm run site

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write # publish the uploaded site
      id-token: write # prove the deployment's origin to Pages
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
